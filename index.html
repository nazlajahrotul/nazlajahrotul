<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Aitouronct — Milky Way Explorer</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">

<style>
:root{
  --blue:#4da3ff;
  --dark:#050b1a;
}

*{margin:0;padding:0;box-sizing:border-box}
body{
  font-family:'Poppins',sans-serif;
  background:radial-gradient(circle at top,#0a1f44,#050b1a);
  color:white;
  overflow-x:hidden;
}

header{
  height:100vh;
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
  text-align:center;
  background:url('https://images.unsplash.com/photo-1446776811953-b23d57bd21aa') center/cover fixed;
}

header h1{
  font-size:3.2rem;
  color:var(--blue);
  animation:fadeDown 1.5s ease;
}
header p{
  max-width:600px;
  opacity:.9;
}

@keyframes fadeDown{
  from{opacity:0;transform:translateY(-40px)}
  to{opacity:1;transform:translateY(0)}
}

section{
  padding:80px 10%;
}

h2{
  text-align:center;
  margin-bottom:40px;
  color:var(--blue);
}

.grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
  gap:30px;
}

.card{
  background:rgba(255,255,255,.05);
  border-radius:18px;
  padding:20px;
  text-align:center;
  cursor:pointer;
  transition:.4s;
}
.card:hover{
  transform:translateY(-12px) scale(1.03);
  box-shadow:0 0 30px rgba(77,163,255,.3);
}
.card img{
  width:140px;
  height:140px;
  object-fit:cover;
  border-radius:50%;
  margin-bottom:15px;
}

.modal{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.85);
  display:none;
  justify-content:center;
  align-items:center;
  z-index:10;
}

.modal-content{
  background:#0b1d3a;
  border-radius:20px;
  max-width:800px;
  width:90%;
  padding:30px;
  animation:zoom .4s ease;
}
@keyframes zoom{
  from{transform:scale(.6);opacity:0}
  to{transform:scale(1);opacity:1}
}

.modal img{
  width:100%;
  border-radius:15px;
  margin:15px 0;
}

.close{
  float:right;
  cursor:pointer;
  font-size:1.4rem;
  color:var(--blue);
}

footer{
  padding:30px;
  text-align:center;
  background:#020712;
  font-size:.9rem;
}
footer a{color:var(--blue);text-decoration:none}
</style>
</head>

<body>

<header>
  <h1>Aitouronct</h1>
  <p>Explore the wonders of the Milky Way Galaxy — planets, stars, and cosmic facts.</p>
</header>

<section>
<h2>☀️ The Sun (Central Star)</h2>
<div class="grid">
  <div class="card" onclick="openModal('Sun','The Sun holds 99.8% of the solar system mass and powers life on Earth.','https://images.unsplash.com/photo-1470290378698-263fa7caed6f')">
    <img src="https://images.unsplash.com/photo-1470290378698-263fa7caed6f">
    <h3>The Sun</h3>
  </div>
</div>
</section>

<section>
<h2>🪐 Planets of the Milky Way</h2>
<div class="grid">

<div class="card" onclick="openModal('Mercury','Smallest planet with extreme temperatures.','https://solarsystem.nasa.gov/system/feature_items/images/18_mercury_new.png')">
<img src="https://solarsystem.nasa.gov/system/feature_items/images/18_mercury_new.png">
<h3>Mercury</h3></div>

<div class="card" onclick="openModal('Venus','Hottest planet due to thick atmosphere.','https://solarsystem.nasa.gov/system/feature_items/images/27_venus_jg.png')">
<img src="https://solarsystem.nasa.gov/system/feature_items/images/27_venus_jg.png">
<h3>Venus</h3></div>

<div class="card" onclick="openModal('Earth','Only known planet with life.','https://solarsystem.nasa.gov/system/feature_items/images/17_earth.png')">
<img src="https://solarsystem.nasa.gov/system/feature_items/images/17_earth.png">
<h3>Earth</h3></div>

<div class="card" onclick="openModal('Mars','The red planet may have had water.','https://solarsystem.nasa.gov/system/feature_items/images/19_mars.png')">
<img src="https://solarsystem.nasa.gov/system/feature_items/images/19_mars.png">
<h3>Mars</h3></div>

<div class="card" onclick="openModal('Jupiter','Largest planet with massive storms.','https://solarsystem.nasa.gov/system/feature_items/images/16_jupiter_new.png')">
<img src="https://solarsystem.nasa.gov/system/feature_items/images/16_jupiter_new.png">
<h3>Jupiter</h3></div>

<div class="card" onclick="openModal('Saturn','Famous for its rings.','https://solarsystem.nasa.gov/system/feature_items/images/28_saturn.png')">
<img src="https://solarsystem.nasa.gov/system/feature_items/images/28_saturn.png">
<h3>Saturn</h3></div>

<div class="card" onclick="openModal('Uranus','Rotates on its side.','https://solarsystem.nasa.gov/system/feature_items/images/29_uranus.png')">
<img src="https://solarsystem.nasa.gov/system/feature_items/images/29_uranus.png">
<h3>Uranus</h3></div>

<div class="card" onclick="openModal('Neptune','Fastest winds in the solar system.','https://solarsystem.nasa.gov/system/feature_items/images/30_neptune.png')">
<img src="https://solarsystem.nasa.gov/system/feature_items/images/30_neptune.png">
<h3>Neptune</h3></div>

</div>
</section>

<footer>
Contact: <a href="https://instagram.com/eirthuoo">@eirthuoo</a><br>
© 2026 Aitouronct Galaxy Project
</footer>

<div class="modal" id="modal">
  <div class="modal-content">
    <span class="close" onclick="closeModal()">✕</span>
    <h2 id="mTitle"></h2>
    <p id="mText"></p>
    <img id="mImg">
  </div>
</div>

<script>
function openModal(title,text,img){
  document.getElementById('modal').style.display='flex';
  mTitle.innerText=title;
  mText.innerText=text;
  mImg.src=img;
}
function closeModal(){
  document.getElementById('modal').style.display='none';
}
</script>

</body>
</html>
